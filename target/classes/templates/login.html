<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>School Portal Login</h1>
    <p>Login using your Registration Number and password.</p>
    <form th:action="@{/login}" method="post" class="auth-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Sign In</button>
        <p th:if="${param.error}" class="error">Invalid username or password.</p>
        <p th:if="${param.logout}" class="ok">Logged out successfully.</p>
    </form>
    <p style="margin-top:10px;"><a th:href="@{/register}">New user? Register here</a></p>
</div>
</body>
</html>
