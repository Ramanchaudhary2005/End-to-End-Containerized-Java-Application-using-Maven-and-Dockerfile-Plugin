<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | School Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>Create Account</h1>
    <p>Choose Student or Teacher registration.</p>

    <form th:action="@{/register}" th:object="${form}" method="post" class="auth-form">
        <label for="role">Register as</label>
        <select id="role" th:field="*{role}" required>
            <option value="">Select role</option>
            <option value="STUDENT">Student</option>
            <option value="TEACHER">Teacher</option>
        </select>

        <label for="fullName">Full name</label>
        <input id="fullName" th:field="*{fullName}" type="text" required>

        <label for="email">Email</label>
        <input id="email" th:field="*{email}" type="email" required>

        <div class="card" style="padding:12px; border-radius:12px;">
            <h2 style="font-size:1rem; margin-bottom:8px;">Student details (only if Student)</h2>
            <label for="course">Course</label>
            <input id="course" th:field="*{course}" type="text" placeholder="Computer Science">

            <label for="yearLevel">Year Level</label>
            <input id="yearLevel" th:field="*{yearLevel}" type="text" placeholder="2nd Year">

            <label for="gender">Gender</label>
            <select id="gender" th:field="*{gender}">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <label for="password">Create password</label>
        <input id="password" th:field="*{password}" type="password" minlength="6" required>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password" minlength="6" required>

        <button type="submit">Register</button>

        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p style="margin-top:8px;"><a th:href="@{/login}">Already have account? Login</a></p>
    </form>
</div>
</body>
</html>
